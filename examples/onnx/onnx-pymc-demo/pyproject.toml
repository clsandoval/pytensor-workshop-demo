[project]
name = "onnx-pymc-demo"
version = "0.1.0"
description = "Bayesian Linear Regression ONNX Demo with PyMC and PyTensor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pymc>=5.0",
    "pytensor>=2.18",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
