[project]
name = "onnx-yolo-demo"
version = "0.1.0"
description = "YOLO11n Object Detection Demo with PyTensor, JAX, and ONNX"
requires-python = ">=3.11"
dependencies = [
    # NOTE: pytensor should be installed from root repo in editable mode FIRST:
    #   cd /path/to/pytensor && uv pip install -e ".[development,onnx]"
    # We do NOT include pytensor here to avoid overriding the local dev version
    "numpy>=2.0",
    "jax[cpu]>=0.4.20",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "wandb>=0.15.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yolo*"]
exclude = ["tests*", "site*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "onnx: marks tests that require ONNX Runtime",
    "browser: marks tests that require browser (Selenium)",
    "performance: marks performance benchmarks (environment-dependent)",
]
addopts = "--durations=20 -v"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["yolo"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
